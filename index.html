<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokd In - Legal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a2a3e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            margin: 20px;
        }
        .logo {
            background-color: #4a9b8e;
            color: white;
            display: inline-block;
            padding: 20px 40px;
            border-radius: 25px;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(74, 155, 142, 0.4);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
        }
        .button {
            display: block;
            background-color: #4a9b8e;
            color: white;
            text-decoration: none;
            padding: 18px 30px;
            border-radius: 15px;
            margin: 15px 0;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .button:hover {
            background-color: #3d8577;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(74, 155, 142, 0.4);
        }
        .button.secondary {
            background-color: transparent;
            border: 2px solid #4a9b8e;
            color: #4a9b8e;
        }
        .button.secondary:hover {
            background-color: #4a9b8e;
            color: white;
        }
        .footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Lokd In</div>
        <h1>Legal Documents</h1>
        <p>View our privacy practices and terms of use</p>
        
        <a href="privacy-policy.html" class="button">Privacy Policy</a>
        <a href="terms-of-service.html" class="button secondary">Terms of Service</a>
        
        <div class="footer">
            <p>Questions? Contact us at:<br>
            <strong>lokdinapp@gmail.com</strong></p>
            <p style="font-size: 12px; color: #ccc;">Last Updated: November 9, 2025</p>
        </div>
    </div>
</body>
</html>
